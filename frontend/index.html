<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pothole3D Vision — Deteksi & Estimasi Volume Lubang Jalan (YOLOv8-seg + SfM DSM)</title>
    <meta name="description" content="Aplikasi web deteksi lubang jalan (YOLOv8-seg) dan estimasi kedalaman/volume dari citra UAV photogrammetry DSM dan Orthomosaic." />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('pothole3d-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
